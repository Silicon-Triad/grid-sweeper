# CI per docs/plan.md §9. Each job calls the matching tools/ci_local.sh subcommand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: tools/ci_local.sh lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: tools/ci_local.sh test

  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: tools/ci_local.sh robustness

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: tools/ci_local.sh interface

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: tools/ci_local.sh notebook

  traceability:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci_local.sh traceability
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

  ai-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check AI-co-authored commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout -q ${{ github.event.pull_request.head.sha }}
            BASE_REF=${{ github.event.pull_request.base.sha }}
          else
            BASE_REF=${{ github.event.before }}
          fi
          BASE_REF="$BASE_REF" tools/ci_local.sh ai-boundary

  spec-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci_local.sh spec-frozen
