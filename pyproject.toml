[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cep"
version = "0.1.0"
description = "CS-323 AI CEP: Intelligent Vacuum-Cleaning Robot (graph search + CSP)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "tools"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# E/W: pycodestyle (PEP 8), F: pyflakes, I: isort, N: pep8-naming,
# D: pydocstyle, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "N", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebook/**" = ["D", "E402"]
